<head>
  <link href="https://fonts.googleapis.com/css?family=Poppins" rel="stylesheet" />
</head>
<body>
  <!-- Hidden SVG filter for liquid-glass refraction (Chromium) -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <filter id="liquid-refraction" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.012 0.012"
        numOctaves="2"
        seed="7"
        result="noise"
      />
      <feGaussianBlur in="noise" stdDeviation="1.5" result="blurred" />
      <feDisplacementMap
        in="SourceGraphic"
        in2="blurred"
        scale="28"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
  </svg>
  <div class="menu-pill">
    <a
      class="home"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <p>Home</p>
    </a>
    <a class="about" routerLink="/About" routerLinkActive="active">
      <p>About</p>
    </a>
    <a class="project" routerLink="/Project" routerLinkActive="active">
      <p>Project</p>
    </a>
    <a class="contact" routerLink="/Contact" routerLinkActive="active">
      <p>Contact</p>
    </a>
  </div>
</body>
